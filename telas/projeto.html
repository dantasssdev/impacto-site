<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conheça nossos projetos</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body class="pagina-projetos">

    <main class="projetos">

        <!-- TÍTULO -->

        <h1 class="titulo-projetos">
            CONHEÇA NOSSOS PROJETOS
        </h1>


        <!-- PROJETOS -->

        <section class="lista-projetos">


            <!-- REVIVA -->

            <div class="item-projeto">

                <h2>REVIVA</h2>

                <button class="projeto" onclick="abrirProjeto('reviva')">

                    <img
                        src="../img/projreviva.jpg"
                        alt="Projeto REVIVA">

                </button>

            </div>


            <!-- ESSENZA -->

            <div class="item-projeto">

                <h2>ESSENZA</h2>

                <button class="projeto" onclick="abrirProjeto('essenza')">

                    <img
                        src="../img/projessenza.png"
                        alt="Projeto ESSENZA">

                </button>

            </div>


            <!-- IMPACTO -->

            <div class="item-projeto">

                <h2>IMPACTO</h2>

                <button class="projeto" onclick="abrirProjeto('impacto')">

                    <img
                        src="../img/projimpacto.png"
                        alt="Projeto IMPACTO">

                </button>

            </div>


            <!-- PROJETO DO VITOR -->

            <div class="item-projeto">

                <h2>PROJETO DO VITOR</h2>

                <button class="projeto" onclick="abrirProjeto('vitor')">

                    <img
                        src="../img/projvitor.png"
                        alt="Projeto do Vitor">

                </button>

            </div>


            <!-- CONTINUAR -->

            <div class="item-projeto item-continuar">

                <h2>&nbsp;</h2>

                <a
                    href="topicos.html"
                    class="projeto botao-proximatela">

                    CONTINUAR

                </a>

            </div>


            <!-- ROBÓTICA -->

            <div class="item-projeto">

                <h2>ROBOTICA 1</h2>

                <button class="projeto" onclick="abrirProjeto('robotica')">

                    <img
                        src="../img/projrobotica.png"
                        alt="Projeto de Robótica">

                </button>

            </div>


        </section>

    </main>


    <!-- FUNDO ESCURO / DESFOCADO -->

    <div
        class="fundo-modal"
        id="fundoModal"
        onclick="fecharProjeto()">
    </div>


    <!-- MODAL DO PROJETO -->

    <section
        class="modal-projeto"
        id="modalProjeto">


        <!-- BOTÃO X -->

        <button
            class="fechar"
            onclick="fecharProjeto()">

            ×

        </button>


        <!-- IMAGEM -->

        <img
            id="imagemProjeto"
            src=""
            alt="Imagem do projeto">


        <!-- TÍTULO -->

        <h2 id="nomeProjeto">
            PROJETO
        </h2>


        <!-- INFORMAÇÕES -->

        <div class="informacoes-projeto">

            <h3>
                INFORMAÇÕES SOBRE O PROJETO
            </h3>

            <p id="descricaoProjeto">
                Informações sobre o projeto.
            </p>

        </div>


        <!-- BOTÃO VOLTAR -->

        <button
            class="botao-voltar"
            onclick="fecharProjeto()">

            VOLTAR

        </button>

    </section>


    <!-- JAVASCRIPT -->

    <script src="../JavaScript/projeto.js"></script>

</body>

</html>
